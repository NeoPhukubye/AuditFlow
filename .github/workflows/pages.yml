name: Deploy to GitHub Pages

# Deploys the static AuditFlow frontend (web/) to GitHub Pages on every push
# to the default branch (and on manual runs). Uses the official GitHub Pages
# Actions so the site is enabled and deployed automatically on first run.
#
# NOTE: set a repository secret named API_URL to your deployed FastAPI backend
# URL (e.g. https://your-app.onrender.com) so the frontend knows where to send
# triage requests. When unset, the site shows a "backend not configured" notice.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read   # checkout
  pages: write     # publish to GitHub Pages
  id-token: write  # OIDC token for Pages publishing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Embed backend API URL into runtime config
        run: |
          printf '{"apiBase":"%s"}' "${{ secrets.API_URL }}" > web/config.json
          echo "config.json: $(cat web/config.json)"

      - name: Validate frontend assets
        run: |
          node --check web/app.js
          node -e "JSON.parse(require('fs').readFileSync('web/config.json','utf8'))"

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
