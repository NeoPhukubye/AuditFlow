[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "auditflow"
version = "1.0.0"
description = "Automated Support Ticket Triage & Compliance Auditor"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "google-genai>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]
